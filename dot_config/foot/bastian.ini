# Bastian's foot settings on the Pi, pulled into Pimarchy's foot.ini by the
# include line that chezmoi's modify_foot.ini keeps at the end of [main].
[main]
# Same font as Ghostty on the laptop. The size comes from display.ini, which
# ~/.config/hypr/scripts/redetect-display.sh rewrites for the XREAL's mode
# (16:9: 10, 32:9: 12).
font=Victor Mono:size=10
include=~/.config/foot/display.ini

[tweak]
# Twice the default thickness for box-drawing lines (imkr's frames and
# separators): thin ones turn into moire in the XREAL.
box-drawing-base-thickness=0.08
