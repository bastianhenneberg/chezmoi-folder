#!/usr/bin/env bash
# foot.ini belongs to Pimarchy (`pimarchy update` refreshes it while untouched).
# chezmoi only makes sure it ends its [main] section with the include of
# bastian.ini, so Bastian's settings win and the rest stays Pimarchy's.
line='include=~/.config/foot/bastian.ini'
awk -v line="$line" '
    $0 == line { next }
    /^[[:space:]]*$/ { blanks = blanks $0 "\n"; next }
    /^\[/ && in_main && !done { print line; done = 1 }
    /^\[/ { in_main = ($0 == "[main]") }
    { printf "%s", blanks; blanks = ""; print }
    END { if (!done) { if (!in_main) print "[main]"; print line }; printf "%s", blanks }
'
